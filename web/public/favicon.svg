<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Postern: a wall with a small side gate in it. -->
  <style>
    .wall { fill: #1c6a57; }
    .gate { fill: #f2f4f1; }
    @media (prefers-color-scheme: dark) {
      .wall { fill: #72cbae; }
      .gate { fill: #111513; }
    }
  </style>
  <rect class="wall" width="32" height="32" rx="8"/>
  <path class="gate" d="M15 32V20a4 4 0 0 1 8 0v12z"/>
</svg>
